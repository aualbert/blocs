[package]
name = "blocs"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
bytes = "1"
dirs = "7.0.0"
earcut = "0.4.12"
eframe = "0.37"
env_logger = { version = "0.11.11", default-features = false }
glam = "0.34.3"
image = { version = "0.25", default-features = false, features = ["png"] }
mvt-reader = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "query", "rustls"] }
rfd = "0.18.0"
serde_json = "1"
sevenz-rust2 = { version = "0.27.0", default-features = false }
walkers = { version = "0.66.0", features = ["mvt"] }
wgpu = "30"

[dev-dependencies]
pollster = "1"
